version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aura-postgres
    restart: always
    environment:
      POSTGRES_DB: aura_archive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aura_secret_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Node.js API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aura-server
    restart: always
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aura_archive
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-aura_secret_2024}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-2024}
    depends_on:
      postgres:
        condition: service_healthy

  # AI Service (Python/FastAPI)
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: aura-ai
    restart: always
    expose:
      - "8001"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-demo_key}
    depends_on:
      - server

  # Nuxt.js Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_URL: /api/v1
    container_name: aura-client
    restart: always
    expose:
      - "3000"
    environment:
      NUXT_PUBLIC_API_URL: /api/v1
    depends_on:
      - server

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: aura-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
      - ai-service

# Data persistence
volumes:
  postgres_data:
    driver: local
