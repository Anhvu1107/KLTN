version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aura-postgres
    restart: always
    environment:
      POSTGRES_DB: aura_archive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aura_secret_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # PRODUCTION SERVICES
  # ============================================

  # Node.js API Server (Production)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aura-server
    restart: always
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aura_archive
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-aura_secret_2024}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-2024}
    depends_on:
      postgres:
        condition: service_healthy

  # AI Service (Production)
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: aura-ai
    restart: always
    expose:
      - "8001"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-demo_key}
    depends_on:
      - server

  # Nuxt.js Client (Production)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_URL: /api/v1
    container_name: aura-client
    restart: always
    expose:
      - "3000"
    environment:
      NUXT_PUBLIC_API_URL: /api/v1
    depends_on:
      - server

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: aura-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
      - ai-service

  # ============================================
  # DEVELOPMENT SERVICES (Hot Reload)
  # ============================================

  # Node.js API Server (Development)
  server-dev:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: aura-server-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aura_archive
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-aura_secret_2024}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-2024}
    depends_on:
      postgres:
        condition: service_healthy

  # AI Service (Development)
  ai-service-dev:
    build:
      context: ./ai_service
      dockerfile: Dockerfile.dev
    container_name: aura-ai-dev
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./ai_service:/app
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-demo_key}
    depends_on:
      - server-dev

  # Nuxt.js Client (Development)
  client-dev:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: aura-client-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.nuxt
    environment:
      NUXT_PUBLIC_API_URL: /api/v1
      NUXT_PROXY_API_URL: http://server-dev:5000
      NODE_ENV: development
    depends_on:
      - server-dev

# Data persistence
volumes:
  postgres_data:
    driver: local
