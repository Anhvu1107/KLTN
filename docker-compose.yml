version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aura-postgres
    restart: always
    environment:
      POSTGRES_DB: aura_archive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aura_secret_2024}
    ports:
      - "5432:5432"
    volumes:
      # Data được lưu ở đây - persist khi container restart
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Node.js API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aura-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aura_archive
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-aura_secret_2024}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
    depends_on:
      postgres:
        condition: service_healthy

  # AI Service (Python/FastAPI)
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: aura-ai
    restart: always
    ports:
      - "8001:8001"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - server

  # Nuxt.js Client (Production Build)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: aura-client
    restart: always
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_URL: http://server:5000/api/v1
    depends_on:
      - server

# QUAN TRỌNG: Volume này lưu data PostgreSQL
# Data sẽ persist ngay cả khi container bị xóa
volumes:
  postgres_data:
    driver: local
    # Trên production: data lưu trong Docker volume
    # Có thể backup bằng: docker exec aura-postgres pg_dump -U postgres aura_archive > backup.sql
